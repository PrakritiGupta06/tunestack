# job_auto — local hybrid relevance model
#
# `hybrid` combines a locally fitted TF-IDF/cosine relevance model with spaCy
# phrase matching when spaCy is installed. `regex` remains a safe fallback.
nlp:
  engine: hybrid
  spacy_model: en_core_web_sm

profile:
  name: "Your Name"
  # Starter example only: replace this profile with facts you confirm or a
  # local resume before treating matches as personalized.
  # Set a relative or absolute path for normal runs, for example:
  # resume: "my_resume.txt"
  resume: null
  # Used by --live until a local resume path is supplied. Keep this factual and
  # do not include contact details; it is local matching input only.
  summary: >-
    Site Reliability and Platform Operations engineer with 3+ years of experience
    supporting distributed enterprise applications. Experience with GCP Anthos/GKE,
    Kubernetes, Terraform, Docker, GitHub Actions, Linux, Python, Bash,
    Java/Spring Boot, Pub/Sub, Apache Airflow, Splunk, Prometheus, Grafana,
    incident response, SLI/SLO monitoring, and SQL.
  # Initial search profile: early-to-mid-career SRE / DevOps / cloud roles.
  target_roles:
    - "site reliability engineer"
    - "sre"
    - "platform engineer"
    - "devops engineer"
    - "cloud engineer"
    - "cloud operations engineer"
    - "production support engineer"
  # Delhi NCR and India / India-remote roles are prioritized. Add other cities
  # as wanted; broader roles remain reviewable in the daily queue.
  locations:
    - "delhi"
    - "new delhi"
    - "noida"
    - "gurugram"
    - "gurgaon"
    - "ghaziabad"
    - "faridabad"
    - "india"
    - "bengaluru"
    - "bangalore"
    - "hyderabad"
    - "pune"
    - "mumbai"
    - "chennai"
    - "remote"
  # Starter skills used for local matching until you supply a factual resume.
  # Verify or replace every item; values are normalized against skills.catalog
  # aliases where possible.
  skills:
    - gcp
    - anthos
    - kubernetes
    - terraform
    - docker
    - helm
    - github actions
    - ci/cd
    - git
    - rest api
    - python
    - bash
    - java
    - spring boot
    - pub/sub
    - apache airflow
    - splunk
    - prometheus
    - grafana
    - linux
    - sql
    - incident response
    - sli/slo

skills:
  # Canonical skill: accepted aliases. Add only terms you want to score; this
  # keeps phrase matching explainable and avoids broad, accidental matches.
  catalog:
    python: ["python", "python3"]
    bash: ["bash", "shell scripting", "shell"]
    java: ["java"]
    spring boot: ["spring boot", "springboot"]
    sql: ["sql", "postgresql", "mysql", "sqlite", "db2"]
    fastapi: ["fastapi", "fast api"]
    docker: ["docker", "containers"]
    kubernetes: ["kubernetes", "k8s", "gke", "google kubernetes engine"]
    anthos: ["anthos"]
    terraform: ["terraform"]
    helm: ["helm"]
    gcp: ["gcp", "google cloud", "google cloud platform"]
    aws: ["aws", "amazon web services"]
    azure: ["azure", "microsoft azure"]
    git: ["git", "github", "gitlab"]
    github actions: ["github actions"]
    ci/cd: ["ci/cd", "continuous integration", "continuous deployment"]
    prometheus: ["prometheus"]
    grafana: ["grafana"]
    splunk: ["splunk"]
    linux: ["linux", "unix"]
    apache airflow: ["apache airflow", "airflow"]
    pub/sub: ["pub/sub", "google pub/sub", "gcp pub/sub"]
    rabbitmq: ["rabbitmq", "rabbit mq"]
    incident response: ["incident response", "incident management", "major incident"]
    sli/slo: ["sli/slo", "sli", "slo", "service level objective"]
    pagerduty: ["pagerduty", "pager duty"]
    servicenow: ["servicenow", "service now"]
    rest api: ["rest api", "rest apis", "restful api", "restful services"]
    pandas: ["pandas"]
    machine learning: ["machine learning", "ml"]
    javascript: ["javascript", "ecmascript"]
    typescript: ["typescript"]
    react: ["react", "react.js", "reactjs"]

matching:
  # Scores are 0–100 and are intended to prioritize a human review queue,
  # never to make an automatic application decision.
  minimum_score: 45
  # Store a daily pool of up to 100 ranked roles. You choose a role before a
  # draft is prepared; this project never submits applications automatically.
  max_results: 100
  weights:
    required_skills: 55
    preferred_skills: 12
    title: 8
    location: 5
    semantic: 20
  # Example: ["unpaid internship", "commission only"]
  exclude_terms: []

# The daily workflow ranks up to 100 full-time SRE/DevOps/cloud/platform roles.
# It keeps unknown arrangement/type listings for review rather than hiding them.
daily_search:
  timezone: "Asia/Kolkata"
  morning_time: "08:00"
  max_results: 100
  workplace_types: ["remote", "hybrid", "on-site"]
  employment_types: ["full-time"]
  include_unknown_workplace_type: true
  include_unknown_employment_type: true
  # Daily ordering keeps Delhi NCR first, then India / India-remote roles,
  # then other remote and broader opportunities. This is a ranking preference,
  # not a hard location filter.
  title_keywords:
    - "site reliability"
    - "sre"
    - "devops"
    - "platform"
    - "cloud engineer"
    - "cloud operations"
    - "reliability engineer"
    - "production support"
  # Avoid management and internships for the starter early-to-mid-career
  # profile; senior individual-contributor roles remain visible for review.
  exclude_title_terms: ["intern", "manager", "director", "principal", "staff", "architect"]
  output_dir: "output/daily"

sources:
  # The built-in source lets `python main.py --demo` run without network access.
  # Replace with one or more sources below for your own review queue.
  - type: demo

  # Local JSON array, JSON object with a `jobs` list, or JSONL:
  # - type: json
  #   name: saved-search
  #   path: jobs.json
  #
  # Public RSS or Atom feed (no login-protected scraping):
  # - type: rss
  #   name: careers-feed
  #   url: https://example.com/jobs.rss
  #   company: Example Company       # optional fallback metadata
  #   location: Remote               # optional fallback metadata

# Run `python main.py --live` for the strict one-off queue, or
# `python daily_discovery.py` for the fault-tolerant daily 100-role digest.
# Sources below are documented public APIs or public employer career boards.
# The daily runner records a source failure but continues with healthy sources;
# it never logs in to LinkedIn, Naukri, Indeed, or any application form.
live_sources:
  # Broad remote discovery across companies, with source attribution retained.
  # Four query URLs are cached for 24 hours so routine local runs stay within
  # Remotive's guidance of no more than four public API requests per day.
  - type: remotive
    name: "Remotive — Site Reliability"
    search: "site reliability engineer"
    limit: 100
    cache_hours: 24
  - type: remotive
    name: "Remotive — DevOps"
    search: "devops engineer"
    limit: 100
    cache_hours: 24
  - type: remotive
    name: "Remotive — Platform"
    search: "platform engineer"
    limit: 100
    cache_hours: 24
  - type: remotive
    name: "Remotive — Cloud"
    search: "cloud engineer"
    limit: 100
    cache_hours: 24

  # Curated public employer boards: growing product companies and established
  # employers with India / Delhi NCR / remote hiring. The title and location
  # filters decide which roles reach the 100-role review queue.
  - type: greenhouse
    name: "New Era Technology careers"
    board: neweratech
    company: "New Era Technology"
    cache_hours: 6
