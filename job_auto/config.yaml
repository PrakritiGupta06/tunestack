# This is intentionally a curated, extensible registry rather than a crawler
# of login-protected job platforms or application forms.

storage:
  # These paths are resolved relative to this config file.
  database: data/job_auto.sqlite3
  report: output/job_matches.csv
  details_report: output/job_matches.json
