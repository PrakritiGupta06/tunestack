apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunestack-api
  labels:
    app: tunestack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tunestack-api
  template:
    metadata:
      labels:
        app: tunestack-api
    spec:
      containers:
        - name: tunestack-api
          image: us-central1-docker.pkg.dev/tunestack-503619/tunestack/tunestack-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
